workflows:
  android-build:
    name: Aura Cyberdefense APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Verify Gemini API key
        script: |
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY is required"; exit 1; }
      - name: Build Android APK (Release)
        script: |
          flutter build apk --release --no-shrink --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
